[package]
name = "qmi-sim-bridge"
version = "0.1.0"
edition = "2021"
description = "Exposes a modem SIM over QMI UIM logical channels, as an AT+CSIM pty or a PC/SC virtual card"
license = "GPL-3.0-or-later"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
