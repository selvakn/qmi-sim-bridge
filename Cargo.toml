[package]
name = "at-qmi-bridge"
version = "0.1.0"
edition = "2021"
description = "Exposes a modem AT port as a pty, serving AT+CSIM over QMI UIM logical channels"
license = "MIT"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
